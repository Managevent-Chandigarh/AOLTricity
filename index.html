<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Find upcoming Satsangs, Long Kriyas and Knowledge Sessions at Art of Living centers.">
<title>Upcoming Events · Art of Living Centers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23e8891d'/><text x='32' y='42' font-size='26' text-anchor='middle' fill='white' font-family='Georgia'>AoL</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <div class="brand-mark" aria-hidden="true">AoL</div>
    <div>
      <h1>Art of Living</h1>
      <p class="tagline">Upcoming Satsangs, Long Kriyas &amp; Knowledge Sessions at our centers</p>
    </div>
  </div>
</header>

<main class="container">
  <section class="controls" aria-label="Search and filters">
    <div class="controls-row">
      <input id="search" type="search" placeholder="Search events, centers, teachers…" aria-label="Search events">
      <select id="center-select" aria-label="Filter by center">
        <option value="all">All centers</option>
      </select>
      <div class="group-toggle" role="group" aria-label="Group events by">
        <button type="button" class="toggle-btn active" data-group="date">By date</button>
        <button type="button" class="toggle-btn" data-group="center">By center</button>
      </div>
    </div>
    <div class="chip-row" id="type-chips" aria-label="Filter by event type"></div>
  </section>

  <p id="result-count" class="result-count" role="status"></p>
  <section id="listings" aria-live="polite"></section>
</main>

<footer class="site-footer">
  <div class="container">
    <!-- <p>🙏 To add or update centers and events, edit <code>data.js</code> — the listing refreshes automatically as dates pass.</p> -->
  </div>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
